name: Convert image to MusicXML and MIDI

on:
  workflow_dispatch:
    inputs:
      image_path:
        description: "Path to the image in this repository, e.g. inputs/score.png"
        required: true
        type: string

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install score-reader
        run: python -m pip install "score-reader[pdf,audio]==0.1.7"

      - name: Verify image exists
        run: test -f "${{ inputs.image_path }}"

      - name: Convert image to MusicXML and MIDI
        run: |
          score-reader "${{ inputs.image_path }}" \
            -o score.json \
            --musicxml score.musicxml \
            --midi score.mid

      - name: Upload MIDI artifact
        uses: actions/upload-artifact@v4
        with:
          name: score-midi
          path: score.mid
          if-no-files-found: error
          retention-days: 30
